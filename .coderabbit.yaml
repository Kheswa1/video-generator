# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
tone_instructions: "Review media-generation code precisely. Prioritize security, provider correctness, cost governance, licensing, job state and asset provenance."
reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_instructions: "Separate code that exists from provider integrations and rendered assets that have been verified. Report tests actually observed and unresolved risks."
  review_status: true
  review_info: true
  review_progress: true
  collapse_walkthrough: false
  changed_files_summary: true
  auto_approvals:
    enabled: false
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
  path_filters:
    - "!**/node_modules/**"
    - "!**/.next/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/coverage/**"
  path_instructions:
    - path: "**/*"
      instructions: |
        This repository is a historical INKWE Motion / AVIDO video-studio project within
        the unified INKWE AI ecosystem. Preserve its identity and code history; do not create
        a competing central AI brain. Review actual code, not the package description.
        Verify provider API contracts, server-side secrets, licensing/terms, cost limits,
        job state, cancellation, retries, output provenance, storage and access control.
        A provider request accepted is not proof a video rendered or persisted.
        Keep mock/demo assets separate from verified generated outputs. Human approval is
        required for spend and publication; automated review cannot authorize either.
chat:
  auto_reply: true
